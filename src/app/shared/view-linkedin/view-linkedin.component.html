<ion-header class="modal-header">
  <ion-toolbar>
    <ion-title>LinkedIn</ion-title>
    <ion-buttons slot="end">
      <ion-button class="close-btn" (click)="close()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  @if (loading) {
    <div class="loading-container">
      <ion-spinner name="crescent"></ion-spinner>
      <p>{{ 'viewer.cargando_publicacion' | translate }}</p>
    </div>
  }

  <div class="iframe-wrapper">
    <iframe
      [src]="safeUrl"
      [class.hidden]="loading"
      frameborder="0"
      allowfullscreen
      scrolling="yes"
      title="LinkedIn post"
      (load)="onIframeLoad()">
    </iframe>
  </div>

  <div class="urlexterna">
    <a href="https://www.linkedin.com/feed/update/urn:li:ugcPost:{{ postId }}" target="_blank">{{ 'viewer.ver_en_linkedin' | translate }}</a>
  </div>

</ion-content>
