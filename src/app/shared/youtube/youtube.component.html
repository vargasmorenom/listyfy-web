@for (item of contenido; track $index) {
  <div class="youtube" id="{{ item.id }}">
    <app-delete-content [idContent]="item.id" [idpost]="idpost" [session]="session"></app-delete-content>
    <ion-card class="contentYoutube" (click)="viewcontent(item)">
      <div class="preview-banner">
        <img [src]="getThumbnail(item)" [alt]="item.titulo || 'YouTube video'" loading="lazy" />
        <ion-icon name="play-circle"></ion-icon>
      </div>
      <ion-card-content>
        @if (item.titulo) {
          <p class="titulo">{{ item.titulo | slice:0:120 }}{{ item.titulo?.length > 120 ? '...' : '' }}</p>
        }
      </ion-card-content>
    </ion-card>
  </div>
}
