@for (item of contenido; track $index) {
  <div class="youtube" id="{{ item.id }}">
    <app-delete-content [idContent]="item.id" [idpost]="idpost" [session]="session"></app-delete-content>
    <ion-card class="contentYoutube" (click)="viewcontent(item)">
      <div class="preview-banner">
        <app-click-hint [itemId]="item.id"></app-click-hint>
        <img [src]="getThumbnail(item)" [alt]="item.titulo || 'YouTube video'" loading="lazy" (error)="$any($event.target).src = 'assets/fondos/youtube.jpg'" />
      </div>
      <ion-card-content>
        @if (item.titulo) {
          <p class="titulo">{{ item.titulo | slice:0:120 }}{{ item.titulo?.length > 120 ? '...' : '' }}</p>
        }
        <div class="hover-slide">
          <span>{{ 'content.click_to_view' | translate }}</span>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
}
