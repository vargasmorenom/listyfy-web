<div class="sidebar-card">
  <h4 class="sidebar-title">Más vistas</h4>
  <ul class="top-list">
    <li *ngFor="let post of filteredTopViewed"
        [routerLink]="['/adminlist']"
        [queryParams]="{ id: post._id }">
      <img *ngIf="post.imagen?.length" [src]="urlfiles + post.imagen[0].small" class="top-thumb" />
      <span class="top-name">{{ post.name }}</span>
    </li>
  </ul>
</div>
