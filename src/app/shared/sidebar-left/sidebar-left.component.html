<ng-container *ngIf="userSession">

  <!-- Card: avatar -->
  <div class="sidebar-card profile-hero" (click)="navigate('/perfil')" style="cursor:pointer">
    <div class="avatar-wrapper">
      <img class="avatar" [src]="profilePic" />
    </div>
    <p class="username">{{ userSession.user }}</p>
  </div>

  <!-- Card: estadísticas -->
  <div class="sidebar-card">
    <div class="profile-stats">
      <div class="stat-item">
        <span class="stat-value">{{ followersCount }}</span>
        <span class="stat-label">
          <ion-icon name="people-outline"></ion-icon>
          Seguidores
        </span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-value">{{ followingCount }}</span>
        <span class="stat-label">
          <ion-icon name="person-add-outline"></ion-icon>
          Siguiendo
        </span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-value">{{ likesCount }}</span>
        <span class="stat-label">
          <ion-icon name="heart-outline"></ion-icon>
          Likes
        </span>
      </div>
    </div>
  </div>

  <!-- Botón destacado: Nueva Lista -->
  <div *ngIf="!currentUrl.startsWith('/newlist')" class="sidebar-card new-list-card" (click)="navigate('/newlist')">
    <ion-icon name="add-circle-outline"></ion-icon>
    <span>Nueva Lista</span>
  </div>

  <!-- Card: navegación -->
  <div class="sidebar-card">
    <nav class="sidebar-nav">
      <a *ngIf="currentUrl !== '/' && currentUrl !== '/home'" (click)="navigate('/')">
        <ion-icon name="home-outline"></ion-icon>
        Inicio
      </a>
      <a *ngIf="!currentUrl.startsWith('/searcher')" (click)="navigate('/searcher')">
        <ion-icon name="search-outline"></ion-icon>
        Buscar
      </a>
      <a *ngIf="!currentUrl.startsWith('/tendencies')" (click)="navigate('/tendencies')">
        <ion-icon name="analytics-outline"></ion-icon>
        Tendencias
      </a>
      <a *ngIf="!currentUrl.startsWith('/adminlist')" (click)="navigate('/adminlist')">
        <ion-icon name="list-outline"></ion-icon>
        Administración
      </a>
      <a *ngIf="!currentUrl.startsWith('/config')" (click)="navigate('/config')">
        <ion-icon name="settings-outline"></ion-icon>
        Configuración
      </a>
      <a class="logout" (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
        Salir
      </a>
    </nav>
  </div>

</ng-container>

<div class="sidebar-card guest-card" *ngIf="!userSession">
  <a (click)="navigate('/login')">Iniciar sesión</a>
  <a (click)="navigate('/register')">Registrarse</a>
</div>
