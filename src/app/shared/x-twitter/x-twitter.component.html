@for (item of contenido; track $index) {
  <div class="twitter-container" id="{{ item.id }}">
    <app-delete-content [idContent]="item.id" [idpost]="idpost" [session]="session"></app-delete-content>
    <ion-card class="contentTwitter" (click)="viewcontent(item)">
      <div class="preview-banner">
        <ion-icon name="logo-twitter"></ion-icon>
      </div>
      <ion-card-content>
        @if (item.titulo) {
          <p class="titulo">{{ item.titulo | slice:0:120 }}{{ item.titulo?.length > 120 ? '...' : '' }}</p>
        }
        @if (item.username) {
          <p class="creador"><strong>&#64;</strong>{{ item.username }}</p>
        }
      </ion-card-content>
    </ion-card>
  </div>
}
