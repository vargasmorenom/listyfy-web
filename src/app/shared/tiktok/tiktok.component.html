@for (item of contenido; track $index) {
  <div class="tiktok" id="{{ item.id }}">
    <app-delete-content [idContent]="item.id" [idpost]="idpost" [session]="session"></app-delete-content>
    <ion-card class="contentTiktok" (click)="viewcontent(item)">
      <div class="preview-banner">
        <img alt="TikTok" src="assets/fondos/tiktok.jpg" />
      </div>
      <ion-card-content>
        <p class="linea-tipo">
          <span class="tipo">{{ item.tipo }}</span>
          <span class="titulo">{{ item.titulo }}</span>
        </p>
        @if (item.titulocortado) {
          <p class="titulocortado">{{ item.titulocortado | slice:0:100 }}{{ item.titulocortado?.length > 100 ? '...' : '' }}</p>
        }
        <p class="autor"><a [href]="item.autorlink">&#64;{{ item.autor }}</a></p>
        <div class="hover-slide">
          <span>{{ 'content.click_to_view' | translate }}</span>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
}
