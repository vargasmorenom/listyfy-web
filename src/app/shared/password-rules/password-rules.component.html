<div class="pass-rules">
  <span [class.ok]="checks.uppercase" [class.fail]="!checks.uppercase">
    {{ checks.uppercase ? '✓' : '✗' }} Una mayúscula
  </span>
  <span [class.ok]="checks.lowercase" [class.fail]="!checks.lowercase">
    {{ checks.lowercase ? '✓' : '✗' }} Una minúscula
  </span>
  <span [class.ok]="checks.number" [class.fail]="!checks.number">
    {{ checks.number ? '✓' : '✗' }} Un número
  </span>
  <span [class.ok]="checks.special" [class.fail]="!checks.special">
    {{ checks.special ? '✓' : '✗' }} Un carácter especial
  </span>
  <span [class.ok]="checks.minlength" [class.fail]="!checks.minlength">
    {{ checks.minlength ? '✓' : '✗' }} Mínimo 8 caracteres
  </span>
</div>
