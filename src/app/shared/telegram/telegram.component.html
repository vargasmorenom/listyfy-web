@for (item of contenido; track $index) {
  <div class="telegram-container" id="{{ item.id }}">
    <app-delete-content [idContent]="item.id" [idpost]="idpost" [session]="session"></app-delete-content>
    <ion-card class="contentTelegram" (click)="viewcontent(item)">
      <div class="preview-banner">
        <app-click-hint [itemId]="item.id"></app-click-hint>
        <ion-icon name="paper-plane"></ion-icon>
      </div>
      <ion-card-content>
        @if (item.titulo) {
          <p class="titulo">{{ item.titulo }}</p>
        }
        <p class="canal">{{ item.id }}</p>
        <div class="hover-slide">
          <span>{{ 'content.click_to_view' | translate }}</span>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
}
