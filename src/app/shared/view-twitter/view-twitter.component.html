<ion-header class="modal-header">
  <ion-toolbar>
    <ion-title>Twitter / X</ion-title>
    <ion-buttons slot="end">
      <ion-button class="close-btn" (click)="close()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  @if (loading) {
    <div class="loading-container">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Cargando tweet...</p>
    </div>
  }

  <div class="iframe-wrapper">
    <iframe
      [src]="safeUrl"
      [class.hidden]="loading"
      frameborder="0"
      allowfullscreen
      scrolling="yes"
      title="Tweet"
      (load)="onIframeLoad()">
    </iframe>
  </div>

  <div class="urlexterna">
    <a href="https://twitter.com/{{ username }}/status/{{ tweetId }}" target="_blank">Ver en X / Twitter</a>
  </div>

</ion-content>
