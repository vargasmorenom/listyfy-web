<div class="home-layout">

  <aside class="sidebar sidebar-left">
    <app-sidebar-left></app-sidebar-left>
  </aside>

  <ion-content class="feed-center" [fullscreen]="true">
    <app-back></app-back>
      <ion-list>
        <ion-item
          *ngFor="let t of tendencias"
          (click)="openTendency(t)"
          detail="true"
        >
          <ion-label>
            <h2>#{{ t.name }}</h2>
            <p>{{ t.count }} publicaciones</p>
          </ion-label>
          <ion-badge color="primary">{{ t.count }}</ion-badge>
        </ion-item>
      </ion-list>

      <ion-infinite-scroll [disabled]="allLoaded" (ionInfinite)="loadMore($event)">
        <ion-infinite-scroll-content loadingSpinner="crescent" loadingText="Cargando más tendencias...">
        </ion-infinite-scroll-content>
      </ion-infinite-scroll>

      <!-- Sección de Predicciones Numéricas -->
      <ion-card>
        <ion-card-header>
          <ion-card-title>Predicciones Numéricas</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <h3>Números Más Frecuentes:</h3>
          <p *ngFor="let top of topNumbers">{{ top.num }} ({{ top.freq }} veces)</p>
          <h3>Predicciones Sugeridas:</h3>
          <ul *ngFor="let pred of predictions">
            <li>{{ pred.join(', ') }}</li>
          </ul>
          <ion-button (click)="generateNewPredictions()" expand="block">Generar Nuevas Predicciones</ion-button>
        </ion-card-content>
      </ion-card>
  </ion-content>

  <aside class="sidebar sidebar-right">
    <app-sidebar-right></app-sidebar-right>
  </aside>

</div>
