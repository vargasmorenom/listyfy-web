<ion-content [fullscreen]="true">
  <ion-card class="verificacion-card">
    <ion-icon name="mail-outline" class="mail-icon"></ion-icon>
    <ion-card-header>
      <ion-card-title>Revisa tu correo</ion-card-title>
      <ion-card-subtitle>
        Te enviamos un enlace de activación. Revisa tu bandeja de entrada y haz clic en el enlace para activar tu cuenta.
      </ion-card-subtitle>
    </ion-card-header>
    <ion-button expand="block" fill="outline" (click)="irAlLogin()">
      Volver al login
    </ion-button>
  </ion-card>
</ion-content>
