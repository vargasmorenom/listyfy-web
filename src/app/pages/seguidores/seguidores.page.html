<div class="home-layout">

  <aside class="sidebar sidebar-left">
    <app-sidebar-left></app-sidebar-left>
  </aside>

  <ion-content class="feed-center" [fullscreen]="true">
    <app-back></app-back>

    <div class="seguidores-container">
      <h2 class="page-title">Seguidores</h2>

      @if (loading) {
        <div class="skeleton-list">
          @for (n of [1,2,3,4,5]; track n) {
            <div class="follow-item skeleton-item">
              <div class="skeleton-avatar"></div>
              <div class="skeleton-text"></div>
            </div>
          }
        </div>
      }

      @if (!loading && items.length === 0) {
        <div class="empty-state">
          <ion-icon name="person-remove-outline"></ion-icon>
          <p>Aún no tienes seguidores.</p>
        </div>
      }

      @for (item of items; track item._id) {
        <div class="follow-item">
          <div class="follow-info" (click)="verPerfil(item.userBy)">
            <img
              class="follow-avatar"
              [src]="resolveImg(item.profilePic?.[0]?.medium ?? item.profilePic?.medium)"
              (error)="$any($event.target).src = defaultAvatar"
              alt="Avatar"
            />
            <div class="follow-text">
              <strong>{{ item.chanelName }}</strong>
              @if (item.description) {
                <span class="follow-desc">{{ item.description }}</span>
              }
            </div>
          </div>
          @if (isOwnProfile) {
            <button class="remove-btn" (click)="confirmRemove(item)" title="Eliminar seguidor">
              <ion-icon name="person-remove-outline"></ion-icon>
            </button>
          }
        </div>
      }
    </div>
  </ion-content>

  <aside class="sidebar sidebar-right">
    <app-sidebar-right></app-sidebar-right>
  </aside>

</div>
