<ion-content [fullscreen]="true">
  <div class="error-container">
    <img src="assets/imagenes/404.png" alt="error" />
    <h1 class="error-code">{{ errorCode }}</h1>
    <h2>{{ errorTitle }}</h2>
    <p>{{ errorMessage }}</p>
    <ion-button (click)="goHome()">
      {{ 'error.regresar' | translate }}
    </ion-button>
  </div>
</ion-content>
